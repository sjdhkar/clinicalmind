<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClinicalMind — AI Clinical Intelligence</title>
  <base href="/clinicalmind/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; background: #0f1117; color: #e2e8f0; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    /* Risk colours */
    .risk-low      { color: #10b981 !important; }
    .risk-medium   { color: #f59e0b !important; }
    .risk-high     { color: #f97316 !important; }
    .risk-critical { color: #ef4444 !important; }

    .bg-risk-low      { background: rgba(16,185,129,.12) !important; border-color: #10b981 !important; }
    .bg-risk-medium   { background: rgba(245,158,11,.12) !important; border-color: #f59e0b !important; }
    .bg-risk-high     { background: rgba(249,115,22,.12) !important; border-color: #f97316 !important; }
    .bg-risk-critical { background: rgba(239,68,68,.12) !important;  border-color: #ef4444 !important; }

    /* Sidebar */
    .sidebar { width: 280px; min-width: 280px; background: #1e2433; border-right: 1px solid #2d3748; height: calc(100vh - 56px); overflow-y: auto; }
    .main-panel { flex: 1; height: calc(100vh - 56px); overflow: hidden; display: flex; flex-direction: column; }

    /* Navbar */
    .navbar { background: #1a1f2e !important; border-bottom: 1px solid #2d3748; }
    .navbar-brand { font-weight: 600; font-size: 1rem; }
    .pulse-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 2s infinite; display: inline-block; }

    /* Patient card */
    .patient-card { cursor: pointer; border-left: 3px solid transparent; transition: all .15s; background: transparent; border-bottom: 1px solid #2d3748; padding: 12px 16px; }
    .patient-card:hover, .patient-card.active { background: #252d3d; }
    .patient-card.active { border-left-color: #3b82f6; }
    .news2-badge { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex-shrink: 0; }

    /* Chat */
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; background: #0f1117; }
    .chat-input-area { padding: 16px 20px; background: #1e2433; border-top: 1px solid #2d3748; }
    .message-bubble { max-width: 75%; }
    .message-bubble.user { margin-left: auto; }
    .bubble-content { background: #1e3a5f; border-radius: 12px 12px 2px 12px; padding: 12px 16px; }
    .bubble-content.assistant { background: #1e2433; border-radius: 12px 12px 12px 2px; border: 1px solid #2d3748; }
    .ai-avatar { width: 32px; height: 32px; background: #1d4ed8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .message-meta { font-size: 11px; color: #64748b; margin-top: 6px; }
    .model-chip { background: #1e2433; border: 1px solid #334155; border-radius: 4px; padding: 1px 6px; font-size: 10px; }

    /* Citations */
    .citation-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; cursor: pointer; border: 1px solid; }
    .citation-obs   { background: rgba(16,185,129,.1); color: #10b981; border-color: #10b981; }
    .citation-note  { background: rgba(59,130,246,.1); color: #60a5fa; border-color: #3b82f6; }
    .citation-proto { background: rgba(139,92,246,.1); color: #a78bfa; border-color: #7c3aed; }

    /* Chat input */
    .chat-textarea { background: #0f1117 !important; color: #e2e8f0 !important; border: 1px solid #334155 !important; border-radius: 10px !important; resize: none; }
    .chat-textarea:focus { border-color: #3b82f6 !important; box-shadow: 0 0 0 2px rgba(59,130,246,.2) !important; }
    .send-btn { background: #1d4ed8; border: none; border-radius: 10px; padding: 8px 20px; color: white; font-size: 14px; }
    .send-btn:disabled { opacity: .5; }

    /* Suggestion chips */
    .suggestion-chip { background: #1e2433; border: 1px solid #2d3748; border-radius: 8px; padding: 8px 14px; font-size: 12px; color: #94a3b8; cursor: pointer; text-align: left; width: 100%; transition: all .15s; }
    .suggestion-chip:hover { border-color: #3b82f6; color: #e2e8f0; }

    /* Thinking dots */
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #64748b; animation: bounce 1.2s infinite; display: inline-block; }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .30s; }

    /* Eval dashboard */
    .metric-card { background: #1e2433; border: 1px solid #2d3748; border-radius: 12px; padding: 16px; text-align: center; }
    .metric-card.pass { border-color: #10b981; }
    .metric-card.fail { border-color: #ef4444; }
    .metric-value { font-size: 26px; font-weight: 600; }
    .metric-bar { height: 4px; background: #2d3748; border-radius: 2px; margin: 8px 0 4px; }
    .metric-bar-fill { height: 4px; border-radius: 2px; }

    /* Table */
    .cm-table { background: #1e2433; border-radius: 12px; overflow: hidden; }
    .cm-table thead th { background: #252d3d; border-color: #2d3748; color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 500; }
    .cm-table tbody td { border-color: #2d3748; color: #cbd5e1; font-size: 13px; vertical-align: middle; }
    .cm-table tbody tr:hover td { background: #252d3d; }

    /* Empty state */
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px; }

    /* Nav link */
    .nav-link { color: #94a3b8 !important; font-size: 13px; padding: 4px 12px !important; border-radius: 6px; }
    .nav-link:hover, .nav-link.active-link { color: #e2e8f0 !important; background: #2d3748; }

    /* Anomaly indicator */
    .anomaly-flash { animation: flash 1.5s infinite; }

    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }
    @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    @keyframes flash { 0%,100%{opacity:1} 50%{opacity:.3} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .fade-in { animation: fadeIn .2s ease-out; }
    .streaming-cursor { animation: blink 1s step-end infinite; color: #64748b; }
  </style>
</head>
<body>
  <cm-root></cm-root>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
